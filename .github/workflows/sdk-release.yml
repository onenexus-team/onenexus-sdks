name: SDK release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: sdk-release
  cancel-in-progress: false
jobs:
  prepare:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          git merge-base --is-ancestor HEAD origin/main
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: python3 -m unittest discover -s tests/logging -p 'test_*.py'
      - run: python3 scripts/test-go-module-release.py
      - run: python3 scripts/test-sdk-release.py
  build:
    needs: prepare
    uses: ./.github/workflows/sdk-build.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      version: ${{ needs.prepare.outputs.version }}
  publish:
    # The whole language matrix must pass before ANY package is published.
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, typescript, dotnet, go]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: sdk-${{ matrix.language }}
          path: .artifacts/publish
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.1.0
        if: matrix.language == 'typescript'
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@v5
        if: matrix.language == 'dotnet'
        with:
          global-json-file: global.json
      - name: Verify artifact versions and dependency inventory
        env:
          SDK_LANGUAGE: ${{ matrix.language }}
          SDK_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/verify-sdk-artifacts.py "$SDK_LANGUAGE" "$SDK_VERSION" .artifacts/publish
      - name: Publish npm packages
        if: matrix.language == 'typescript'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          SDK_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npmrc="$RUNNER_TEMP/sdk.npmrc"
          trap 'rm -f "$npmrc"' EXIT
          cat > "$npmrc" <<'EOF'
          @onenexus-team:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          chmod 600 "$npmrc"
          export NPM_CONFIG_USERCONFIG="$npmrc"
          for name in sdk-core cas-client cas-support-client observability; do
            npm publish ".artifacts/publish/onenexus-team-$name-$SDK_VERSION.tgz" --registry=https://npm.pkg.github.com
          done
      - name: Publish NuGet package
        if: matrix.language == 'dotnet'
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
          SDK_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dotnet nuget push ".artifacts/publish/OneNexus.Observability.$SDK_VERSION.nupkg" \
            --api-key "$NUGET_AUTH_TOKEN" --source https://nuget.pkg.github.com/onenexus-team/index.json
      - name: Create Go module tag at the SDK release commit
        if: matrix.language == 'go'
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 scripts/go-module-release.py publish --kind observability \
            --version "$SDK_VERSION" --archive ".artifacts/publish/observability-go-v$SDK_VERSION.zip"
      - name: Attach the tested artifacts to the SDK release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: .artifacts/publish/*
          fail_on_unmatched_files: true
          overwrite_files: false

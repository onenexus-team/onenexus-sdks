name: SDK release

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

concurrency:
  group: sdk-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-python-wheels:
    name: Build and release Python wheels
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Set package version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match v<major>.<minor>.<patch>; got: $RELEASE_TAG" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          printf '%s\n' "$version" > VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore and test Python packages
        working-directory: python
        run: |
          uv sync --all-extras --frozen
          uv run pytest

      - name: Build Python wheels
        run: bash scripts/build-python-wheels.sh .artifacts/python-wheels

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-wheels-${{ steps.version.outputs.version }}
          path: .artifacts/python-wheels/*.whl
          if-no-files-found: error

      - name: Attach Python wheels to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" .artifacts/python-wheels/*.whl --clobber

  release-typescript-packages:
    name: Build and publish TypeScript packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up pnpm with cache
        uses: pnpm/action-setup@v6.0.9
        with:
          package_json_file: ts/package.json
          run_install: false
          cache: true
          cache_dependency_path: ts/pnpm-lock.yaml

      - name: Set package version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match v<major>.<minor>.<patch>; got: $RELEASE_TAG" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          printf '%s\n' "$version" > VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore TypeScript packages
        run: pnpm --dir ts install --frozen-lockfile

      - name: Build and package TypeScript SDKs
        run: |
          pnpm --dir ts package
          mkdir -p .artifacts/typescript-packages
          cp ts/.local-packages/*.tgz .artifacts/typescript-packages/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: typescript-packages-${{ steps.version.outputs.version }}
          path: .artifacts/typescript-packages/*.tgz
          if-no-files-found: error

      - name: Publish TypeScript packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        working-directory: ts
        run: |
          npmrc="${RUNNER_TEMP:-$PWD}/onenexus-npmrc"
          cat > "$npmrc" <<EOF
          @onenexus-team:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          always-auth=true
          EOF
          chmod 600 "$npmrc"
          export NPM_CONFIG_USERCONFIG="$npmrc"

          for package_dir in packages/sdk-core packages/cas-client packages/cas-support-client; do
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"

            if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
              echo "Expected ${package_name} version ${RELEASE_VERSION}, got ${package_version}" >&2
              exit 1
            fi

            if npm view "${package_name}@${package_version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "${package_name}@${package_version} already exists in GitHub Packages; skipping publish."
              continue
            fi

            pnpm --dir "$package_dir" publish --no-git-checks --registry=https://npm.pkg.github.com
          done

      - name: Attach TypeScript packages to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" .artifacts/typescript-packages/*.tgz --clobber

name: Log contract release
on:
  push:
    tags: ['log-correlation-v*']
permissions:
  contents: read
concurrency:
  group: log-contract-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.21'
      - name: Require a version tag on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^log-correlation-v([0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+(\.[a-z0-9]+)*)?)$ ]] \
            || { echo 'Invalid contract tag'; exit 1; }
          version="${TAG#log-correlation-v}"
          git merge-base --is-ancestor HEAD origin/main
          manifest_version="$(python3 -c 'import json; print(json.load(open("contracts/log-correlation/manifest.json"))["version"])')"
          [[ "$version" == "$manifest_version" ]] \
            || { echo 'Tag does not match contract version'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate before packaging
        run: bash scripts/check-log-contracts.sh
      - name: Build and verify archive and Python wheel
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/log-contract
          digest="$(python3 -c 'import json; print(json.load(open("contracts/log-correlation/manifest.json"))["sha256"])')"
          python3 contracts/log-correlation/check_contract.py build \
            --version "$VERSION" --expected-digest "$digest" \
            --output ".artifacts/log-contract/log-correlation-$VERSION.tar.gz"
          python3 scripts/build-log-contract-package.py \
            --version "$VERSION" --expected-digest "$digest" --out-dir .artifacts/log-contract
          python3 scripts/verify-log-contract-wheel.py \
            --wheel .artifacts/log-contract/*.whl \
            --archive ".artifacts/log-contract/log-correlation-$VERSION.tar.gz" \
            --version "$VERSION" --expected-digest "$digest"
          cd .artifacts/log-contract
          sha256sum *.tar.gz *.whl > SHA256SUMS
      - name: Upload validation artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: log-correlation-${{ steps.version.outputs.version }}
          path: .artifacts/log-contract/*
          if-no-files-found: error
      - name: Publish a new release without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release exists; refusing to overwrite.'
            exit 1
          fi
          flags=()
          [[ "$VERSION" != *-* ]] || flags+=(--prerelease)
          gh release create "$TAG" --draft --verify-tag "${flags[@]}" \
            --title "Log correlation contract $VERSION" \
            --notes 'Schema, shared test cases, offline checker and generated onenexus-log-contract Python wheel. No logging hooks or production adoption claim.' \
            ".artifacts/log-contract/log-correlation-$VERSION.tar.gz" \
            .artifacts/log-contract/*.whl \
            .artifacts/log-contract/SHA256SUMS
          # Keep an interrupted release in draft. Never replace its assets blindly.
          downloaded="$(mktemp -d)"
          trap 'rm -rf "$downloaded"' EXIT
          gh release download "$TAG" --dir "$downloaded"
          cmp .artifacts/log-contract/SHA256SUMS "$downloaded/SHA256SUMS"
          (cd "$downloaded" && sha256sum --check SHA256SUMS)
          digest="$(python3 -c 'import json; print(json.load(open("contracts/log-correlation/manifest.json"))["sha256"])')"
          python3 scripts/verify-log-contract-wheel.py \
            --wheel "$downloaded"/*.whl --archive "$downloaded/log-correlation-$VERSION.tar.gz" \
            --version "$VERSION" --expected-digest "$digest"
          gh release edit "$TAG" --draft=false --latest=false

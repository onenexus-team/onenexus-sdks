name: Log contract checks
on:
  pull_request:
    paths:
      - 'contracts/log-correlation/**'
      - 'scripts/check-log-contracts.sh'
      - '.github/workflows/log-contract-*.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/log-correlation/**'
      - 'scripts/check-log-contracts.sh'
      - '.github/workflows/log-contract-*.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate contract and shared checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            bash scripts/check-log-contracts.sh "$BASE_SHA"
          else
            bash scripts/check-log-contracts.sh
          fi

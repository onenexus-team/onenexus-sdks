name: Log contract checks
on:
  pull_request:
    paths:
      - 'contracts/log-correlation/**'
      - 'scripts/*log-contract*'
      - 'scripts/*go*'
      - 'go/**'
      - '.github/workflows/log-contract-*.yml'
      - '.github/workflows/sdk-release.yml'
      - 'ts/packages/log-contract/**'
      - 'ts/packages/observability/**'
      - 'dotnet/src/OneNexus.Observability/**'
      - 'ts/pnpm-lock.yaml'
      - 'dotnet/src/OneNexus.LogContract/**'
      - 'dotnet/Directory.Build.props'
      - 'scripts/sync-ts-package-versions.mjs'
      - 'scripts/check-*-observability.sh'
  push:
    branches: [main]
    paths:
      - 'contracts/log-correlation/**'
      - 'scripts/*log-contract*'
      - 'scripts/*go*'
      - 'go/**'
      - '.github/workflows/log-contract-*.yml'
      - '.github/workflows/sdk-release.yml'
      - 'ts/packages/log-contract/**'
      - 'ts/packages/observability/**'
      - 'dotnet/src/OneNexus.Observability/**'
      - 'ts/pnpm-lock.yaml'
      - 'dotnet/src/OneNexus.LogContract/**'
      - 'dotnet/Directory.Build.props'
      - 'scripts/sync-ts-package-versions.mjs'
      - 'scripts/check-*-observability.sh'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.21'
      - name: Validate contract and shared checks
        run: bash scripts/check-log-contracts.sh
      - name: Build and install Python contract wheel
        run: bash scripts/check-log-contract-package.sh
  all-languages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.21'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ts/package.json
          run_install: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            contracts/log-correlation/go.sum
            go/observability/go.sum
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: pnpm --dir ts install --frozen-lockfile
      - name: Check release guards and version separation
        run: python3 scripts/test-log-contract-release.py
      - name: Build and validate every language artifact without publishing
        run: |
          version="$(python3 -c 'import json; print(json.load(open("contracts/log-correlation/manifest.json"))["version"])')"
          python3 scripts/log-contract-release.py build --version "$version" --directory .artifacts/log-contract
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: contract-packages-all-languages
          path: .artifacts/log-contract/
          if-no-files-found: error

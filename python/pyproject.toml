# Virtual `uv` workspace root for the OneNexus Python SDKs.
#
# Mirrors `ts/` (a pnpm workspace). Each member package lives under
# `packages/*`, is built and tested independently, and shares one resolved
# lockfile so internal dependencies resolve through the workspace.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
onenexus-sdk-core = { workspace = true }
onenexus-cas-client = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
examples = [
    "boto3>=1.35",
]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = [
    "(?:^|/)build/",
    "(?:^|/)dist/",
    "(?:^|/)tests?/",
]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["onenexus_cas_client.generated.*"]
ignore_errors = true

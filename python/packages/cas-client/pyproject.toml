[project]
name = "onenexus-cas-client"
dynamic = ["version"]
description = "Typed async client for the OneNexus Central Auth Service Customer API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "onenexus-sdk-core",
    "httpx>=0.27",
    "microsoft-kiota-abstractions>=1.10",
    "microsoft-kiota-http>=1.9",
    "microsoft-kiota-serialization-form>=1.10",
    "microsoft-kiota-serialization-json>=1.10",
    "microsoft-kiota-serialization-multipart>=1.10",
    "microsoft-kiota-serialization-text>=1.10",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../../../VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/onenexus_cas_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/onenexus_cas_client/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["onenexus_cas_client"]
mypy_path = "src"
exclude = ["src/onenexus_cas_client/generated/"]

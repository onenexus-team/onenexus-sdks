[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusai"
dynamic = ["version"]
description = "NexusAI MLOps SDK and CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "OneNexus Team"}]
maintainers = [{name = "OneNexus Team"}]
license = "LicenseRef-Proprietary"
keywords = ["ai", "mlops", "training", "inference", "onenexus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.34",
    "PyJWT[crypto]>=2.8",
    "onenexus-sdk-core @ https://github.com/onenexus-team/onenexus-sdks/releases/download/v0.0.15/onenexus_sdk_core-0.0.15-py3-none-any.whl#sha256=e05ab620aa5caa5eb3bc7eb91cc9145e3c9e9fc871dc53138917fdea2f87bb97",
    "onenexus-cas-client @ https://github.com/onenexus-team/onenexus-sdks/releases/download/v0.0.15/onenexus_cas_client-0.0.15-py3-none-any.whl#sha256=f8968073ab84827a5d69bfcf834c5f64da396f95759d8fa16c1904f886a2a865",
]

[project.urls]
Homepage = "https://github.com/onenexus-team/onenexus-sdks"
Documentation = "https://github.com/onenexus-team/onenexus-sdks/tree/main/python/packages/nexusai"
Issues = "https://github.com/onenexus-team/onenexus-sdks/issues"
Security = "https://github.com/onenexus-team/onenexus-sdks/security"
Support = "https://github.com/onenexus-team/onenexus-sdks/issues"
Changelog = "https://github.com/onenexus-team/onenexus-sdks/blob/main/python/packages/nexusai/CHANGELOG.md"

[project.scripts]
nexusai = "nexusai.cli:main"

[tool.setuptools.packages.find]
include = ["nexusai*"]

[tool.setuptools.dynamic]
version = {attr = "nexusai._version.__version__"}

[tool.setuptools.package-data]
nexusai = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusai"
dynamic = ["version"]
description = "NexusAI MLOps SDK and CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "OneNexus Team"}]
maintainers = [{name = "OneNexus Team"}]
license = "LicenseRef-Proprietary"
keywords = ["ai", "mlops", "training", "inference", "onenexus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.34",
    "PyJWT[crypto]>=2.8",
    "onenexus-sdk-core @ https://github.com/onenexus-team/onenexus-sdks/releases/download/v0.0.8/onenexus_sdk_core-0.0.8-py3-none-any.whl#sha256=0bd2e8c7ff5d1319ed4062bcc824828aeb56440ed5603cdd4433b7532ff090cf",
    "onenexus-cas-client @ https://github.com/onenexus-team/onenexus-sdks/releases/download/v0.0.8/onenexus_cas_client-0.0.8-py3-none-any.whl#sha256=0629868f45b7c8b6cb34f7e90402776dc8d14db54500086f494147d35653d2bb",
]

[project.urls]
Homepage = "https://github.com/onenexus-team/onenexus-sdks"
Documentation = "https://github.com/onenexus-team/onenexus-sdks/tree/main/python/packages/nexusai"
Issues = "https://github.com/onenexus-team/onenexus-sdks/issues"
Security = "https://github.com/onenexus-team/onenexus-sdks/security"
Support = "https://github.com/onenexus-team/onenexus-sdks/issues"
Changelog = "https://github.com/onenexus-team/onenexus-sdks/blob/main/python/packages/nexusai/CHANGELOG.md"

[project.scripts]
nexusai = "nexusai.cli:main"

[tool.setuptools.packages.find]
include = ["nexusai*"]

[tool.setuptools.dynamic]
version = {attr = "nexusai._version.__version__"}

[tool.setuptools.package-data]
nexusai = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]

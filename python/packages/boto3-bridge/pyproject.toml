[project]
name = "onenexus-boto3"
dynamic = ["version"]
description = "boto3 credential bridge for OneNexus: workload-identity -> CAS AssumeS3Role with automatic STS refresh."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "onenexus-sdk-core",
    "onenexus-cas-client",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../../../VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/onenexus_boto3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["onenexus_boto3"]
mypy_path = "src"

# boto3/botocore ship no type information; treat them as untyped at the seam.
[[tool.mypy.overrides]]
module = ["onenexus_boto3.credentials"]
disable_error_code = ["import-untyped"]

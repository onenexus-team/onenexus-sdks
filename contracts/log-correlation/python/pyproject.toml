[project]
name = "onenexus-log-contract"
dynamic = ["version"]
description = "OneNexus log-correlation schema and shared cases; generated from canonical JSON."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/onenexus_log_contract/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/onenexus_log_contract"]
